server:
  port: ${PORT:8080}
  # set to "framework" behind nginx/Caddy so X-Forwarded-* headers are honoured
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never

spring:
  application:
    name: bookbuddy
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/bookbuddy}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:50}MB
      max-request-size: ${MAX_UPLOAD_MB:50}MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

bookbuddy:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    allowed-models: ${GROQ_ALLOWED_MODELS:openai/gpt-oss-20b,llama-3.3-70b-versatile}
    default-model: ${GROQ_MODEL:openai/gpt-oss-20b}
  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    model-path: ${EMBEDDING_MODEL_PATH:models/model.onnx}
    tokenizer-path: ${EMBEDDING_TOKENIZER_PATH:models/tokenizer.json}
    dimension: 384
    max-tokens: 512
  ingestion:
    upload-dir: ${UPLOAD_DIR:uploads}
    max-pages: ${MAX_PAGES:800}
    min-chars-per-page: ${MIN_CHARS_PER_PAGE:40}
    chunk-tokens: 350
    chunk-overlap-tokens: 60
  vector:
    index-name: ${VECTOR_INDEX_NAME:book_chunks_vector_index}
    top-n: 8
    top-k: 5
    min-similarity: 0.35
    # atlas = try $vectorSearch then fall back to brute-force cosine; memory = brute-force only
    mode: ${VECTOR_MODE:atlas}
  safety:
    crisis-resources:
      - name: Tele-MANAS
        phone: "14416"
      - name: KIRAN
        phone: "1800-599-0019"
      - name: Emergency
        phone: "112"
  quota:
    daily-request-soft-limit: ${LLM_DAILY_SOFT_LIMIT:900}
  prompt:
    # versioned files in src/main/resources/prompt/<id>.txt; set CHAT_PROMPT_ID=chat.system.v2 to roll back
    chat-system-id: ${CHAT_PROMPT_ID:chat.system.v3}
    query-rewrite-id: ${QUERY_REWRITE_PROMPT_ID:query-rewrite.v1}
  rag:
    # complete passages that start/end mid-sentence from the neighbouring chunk
    expand-truncated-neighbors: ${RAG_EXPAND_NEIGHBORS:true}
    neighbor-max-chars: 400
    # heuristic (free) | llm (one small call per follow-up, heuristic on failure) | off
    rewrite-mode: ${RAG_REWRITE_MODE:heuristic}
  memory:
    # queue extraction after this many new messages, or when a conversation has been idle this many minutes
    extract-every-messages: 6
    idle-minutes: 10
    emotional-context-days: 14
    core-profile-tokens: 150
    memory-tokens: 350
    max-memories-per-prompt: 8
    max-candidates-per-run: 8
    min-similarity: 0.35
    duplicate-similarity: 0.90
    merge-similarity: 0.75
    recency-half-life-days: 45
    max-rebuild-calls: 20
    consolidate-above: 60
  jobs:
    enabled: ${JOBS_ENABLED:true}
    poll-ms: 5000
    initial-delay-ms: 15000

logging:
  pattern:
    # correlation id comes from CorrelationIdFilter (X-Correlation-Id header, echoed on every response)
    level: "%5p [cid=%X{correlationId:-}]"
  level:
    root: INFO
    com.bookbuddy: INFO
    org.springframework.data.mongodb: WARN
